<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Line Tools mark — the sibling of BOIL's B (boil-marketing
       public/favicon.svg): same dark ground, same accent letter, same
       warm-glow bubbles clipped inside the letter's ink. The masthead
       says "Line Tools by BOIL"; the tab should say it too.

       Bubble centers sit ON the L's ink — the stem and the foot — so
       the clip reveals them instead of swallowing them. Positions were
       set by rendering, not by guessing at glyph metrics.

       Static: animation doesn't render in favicon / PWA / OS-dock
       contexts. No webfont is loaded here or anywhere on this site, so
       the letter renders in the system's heavy sans. -->
  <rect width="256" height="256" fill="#1a1715"/>
  <defs>
    <clipPath id="l-clip">
      <text x="128" y="208" text-anchor="middle"
            font-family="Inter, system-ui, sans-serif"
            font-weight="900" font-size="200">L</text>
    </clipPath>
    <radialGradient id="bubble-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"    />
      <stop offset="35%"  stop-color="#ffd966" stop-opacity="0.95" />
      <stop offset="70%"  stop-color="#ee7a30" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#cc5500" stop-opacity="0"    />
    </radialGradient>
  </defs>
  <text x="128" y="208" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-weight="900" font-size="200" fill="#cc5500">L</text>
  <g clip-path="url(#l-clip)" fill="url(#bubble-glow)">
    <circle cx="88"  cy="80"  r="14" />
    <circle cx="92"  cy="128" r="12" />
    <circle cx="86"  cy="172" r="13" />
    <circle cx="120" cy="196" r="13" />
    <circle cx="158" cy="192" r="14" />
    <circle cx="96"  cy="104" r="10" />
  </g>
</svg>
